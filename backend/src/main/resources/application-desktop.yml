# Perfil do programa (Windows). O Electron liga a API com --spring.profiles.active=desktop
# e passa as variáveis VYBE_DADOS, VYBE_FRONTEND, VYBE_DESKTOP_TOKEN e JWT_SEGREDO.
# O banco é o PostgreSQL embutido (veja src/desktop/java/.../BancoEmbutido.java).

server:
  # Só aceita conexões do próprio computador
  address: 127.0.0.1
  port: ${PORT:47823}
  # Uma pessoa só usando: poucas threads bastam e gastam menos memória
  tomcat:
    threads:
      max: 16
      min-spare: 2

spring:
  main:
    # Cria cada parte da API só quando ela é usada pela primeira vez: abre mais rápido e
    # não ocupa memória com o que a pessoa não usa (ex.: Spotify sem estar conectado).
    lazy-initialization: true

vybe:
  desktop:
    ativo: true
    # Pasta de dados do usuário (banco, músicas enviadas e capas)
    dados: ${VYBE_DADOS:${user.home}/.vybe}
    # Pasta com o React já compilado
    frontend: ${VYBE_FRONTEND:../frontend/dist}
    token: ${VYBE_DESKTOP_TOKEN:}
  cors-origens: http://127.0.0.1:${server.port}
  frontend-url: http://127.0.0.1:${server.port}
  armazenamento:
    pasta: ${vybe.desktop.dados}/arquivos
  spotify:
    # No programa o login do Spotify usa PKCE: não precisa (nem deve ter) Client Secret
    redirect-uri: http://127.0.0.1:${server.port}/api/spotify/callback
