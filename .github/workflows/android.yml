# Gera o app Android (APK) do VYBE e anexa ao release do GitHub.
#
# Roda sozinho quando um release é publicado (APK final, assinado com a chave do VYBE).
# À mão, em Actions > App Android > Run workflow, gera um APK de teste: não precisa da
# chave de assinatura e instala como um app separado ("VYBE" com id com.cauan.vybe.teste),
# então dá para testar sem mexer no app final. O APK fica nos "Artifacts" da execução.
#
# Precisa (Settings > Secrets and variables > Actions), veja docs/APP.md:
#   variável VYBE_API_URL            endereço da API hospedada, terminando em /api
# e, só para o APK final:
#   segredo  ANDROID_KEYSTORE_BASE64 a chave de assinatura (arquivo .keystore em base64)
#   segredo  ANDROID_KEYSTORE_PASSWORD
#   segredo  ANDROID_KEY_ALIAS
#   segredo  ANDROID_KEY_PASSWORD
name: App Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tipo:
        description: "teste = sem chave, instala separado do app final; final = assinado"
        type: choice
        options: [teste, final]
        default: teste
      versao:
        description: "Versão do app (ex.: 0.3.0)"
        required: false
        default: "0.3.0"
      api:
        description: "Endereço da API (opcional; vazio = variável VYBE_API_URL)"
        required: false
        default: ""

permissions:
  contents: write # para anexar o APK ao release

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSAO_ENTRADA: ${{ github.event.release.tag_name || inputs.versao }}
      TIPO: ${{ github.event_name == 'release' && 'final' || inputs.tipo }}
      VITE_API_URL: ${{ inputs.api || vars.VYBE_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir a configuração
        env:
          TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSAO="${VERSAO_ENTRADA#v}"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Versão inválida: '$VERSAO_ENTRADA' (use algo como v0.3.0)"; exit 1
          fi
          if [[ -z "$VITE_API_URL" || "$VITE_API_URL" != https://*/api ]]; then
            echo "::error::Crie a variável VYBE_API_URL com o endereço da API, ex.: https://vybe-api.onrender.com/api"; exit 1
          fi
          if [[ "$TIPO" == "final" && "$TEM_CHAVE" != "true" ]]; then
            echo "::error::Faltam os segredos da chave de assinatura (ANDROID_KEYSTORE_*). Veja docs/APP.md"; exit 1
          fi
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "Gerando o APK $TIPO $VERSAO para a API $VITE_API_URL"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar as telas (modo app)
        run: npm run app:build

      - name: Criar o projeto Android
        run: |
          npx cap add android
          if [[ "$TIPO" == "teste" ]]; then
            node mobile/preparar-android.mjs "$VERSAO" --teste
          else
            node mobile/preparar-android.mjs "$VERSAO"
          fi
          npx cap sync android

      - name: Compilar
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          if [[ "$TIPO" == "teste" ]]; then
            # APK de teste: o Gradle assina sozinho com uma chave de desenvolvimento.
            ./gradlew assembleDebug --no-daemon --stacktrace
            SAIDA="$GITHUB_WORKSPACE/VYBE-$VERSAO-teste.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$SAIDA"
            echo "APK=$SAIDA" >> "$GITHUB_ENV"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Assinar
        if: env.TIPO == 'final'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_SENHA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHAVE_SENHA: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vybe.keystore"
          FERRAMENTAS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SEM_ASSINATURA=app/build/outputs/apk/release/app-release-unsigned.apk
          SAIDA="$GITHUB_WORKSPACE/VYBE-$VERSAO.apk"
          "$FERRAMENTAS/zipalign" -p -f 4 "$SEM_ASSINATURA" "$RUNNER_TEMP/alinhado.apk"
          "$FERRAMENTAS/apksigner" sign \
            --ks "$RUNNER_TEMP/vybe.keystore" \
            --ks-pass env:KS_SENHA \
            --ks-key-alias "$CHAVE_ALIAS" \
            --key-pass env:CHAVE_SENHA \
            --out "$SAIDA" \
            "$RUNNER_TEMP/alinhado.apk"
          "$FERRAMENTAS/apksigner" verify "$SAIDA"
          rm -f "$RUNNER_TEMP/vybe.keystore"
          echo "APK=$SAIDA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: VYBE-${{ env.VERSAO }}-${{ env.TIPO }}-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Anexar ao release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK" --clobber
