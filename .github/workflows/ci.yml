name: CI

# Confere a cada push e pull request que a API passa nos testes (nas duas versões: a da
# nuvem e a do programa com o banco embutido) e que as telas compilam.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes (versão da nuvem)
        run: mvn -B -ntp test

      - name: Compilar a versão do programa (banco embutido)
        run: mvn -B -ntp -Pdesktop -DskipTests compile

      - name: Resumo dos testes
        if: always()
        run: |
          total=0; falhas=0
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            e=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            r=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + t)); falhas=$((falhas + e + r))
          done
          echo "### API: $total testes, $falhas com falha" >> "$GITHUB_STEP_SUMMARY"

  telas:
    name: Telas (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build da versão web
        run: npm run build

      - name: Build da versão do app Android
        env:
          VITE_API_URL: https://exemplo.onrender.com/api
        run: npm run app:build
